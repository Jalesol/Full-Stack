<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>

    <style>
        .caixa {
            background-color: blueviolet;
            width:700px;
        }

        .destaque {
            border: 1px solid orange;
            border-radius: 30px;
            width: 200px;
            text-align: center;
            position: relative;
            left: 100px;
            background-color: orange;
        }


        .promocao {
            border: 1px dotted red;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            text-align: center;
            position: relative;
            top: 20px;
            color: blueviolet;


        }
    </style>
</head>
<body>
    <h1>Exercício</h1>

    <div class="caixa">
        <img src="img/banner.png" width="700px" alt="">

        <div class="destaque">
            Tempo limitado
        </div>

        <div class="promocao">
            Quero a promoção 
        </div>
    </div>

</body>
</html>
